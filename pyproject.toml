[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperos-privacy-toolkit"
version = "0.1.0"
description = "Conservative ADB and UI automation toolkit for verified Xiaomi, Redmi and POCO privacy controls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HyperOS Privacy Toolkit contributors" }]
dependencies = ["uiautomator2>=3.7.1,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
hyperos-privacy = "hyperos_privacy_toolkit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
