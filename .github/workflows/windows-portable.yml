name: Build portable Windows application

on:
  push:
    branches:
      - feature/windows-portable-build
  pull_request:
    paths:
      - "src/**"
      - "profiles/**"
      - "pyproject.toml"
      - ".github/workflows/windows-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and bundler
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6,<7"
      - name: Run offline tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v
      - name: Build portable executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name HyperOS-Privacy-Toolkit --paths src --add-data "profiles;profiles" --collect-all uiautomator2 --collect-all adbutils --collect-all PIL tools/launch_gui.py
      - name: Verify packaged dependencies and profiles
        shell: pwsh
        run: |
          & ".\dist\HyperOS-Privacy-Toolkit\HyperOS-Privacy-Toolkit.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed" }
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Copy-Item docs/safety-and-data-handling.md dist/HyperOS-Privacy-Toolkit/SAFETY.md
          Copy-Item LICENSE dist/HyperOS-Privacy-Toolkit/LICENSE.txt
          Compress-Archive -Path "dist/HyperOS-Privacy-Toolkit" -DestinationPath "HyperOS-Privacy-Toolkit-Windows-x64.zip"
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Privacy-Toolkit-Windows-x64
          path: HyperOS-Privacy-Toolkit-Windows-x64.zip
          retention-days: 14
